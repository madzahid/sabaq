<!DOCTYPE html>
<html lang="ur" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#12594a" />
    <title>قرآن برائے حفظ · Quran for Hifz — 16 Line Indo-Pak Quran</title>

    <meta name="description" content="The 16-line Indo-Pak Mushaf for hifz, line for line as it is printed — with ruku, sajdah and para marks, colour-coded tajweed, and a listening mode for the person hearing the student recite. Free, and works offline." />
    <link rel="canonical" href="https://quranforhifz.com/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Quran for Hifz" />
    <meta property="og:title" content="قرآن برائے حفظ · Quran for Hifz" />
    <meta property="og:description" content="The 16-line Indo-Pak Mushaf for hifz, line for line as it is printed. Free, and works offline." />
    <meta property="og:url" content="https://quranforhifz.com/" />
    <meta property="og:locale" content="ur_PK" />
    <meta property="og:locale:alternate" content="en_GB" />
    <meta property="og:locale:alternate" content="ar_SA" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- The database is the critical path: nothing renders until it is parsed.
         Without this the browser only discovers it after the JS has loaded and
         run — about 1.4s in — so the two big downloads run one after the other
         instead of together. -->
    <!-- No crossorigin here, deliberately: on a same-origin as="fetch" preload
         it would make this a CORS request, which would not match the plain
         fetch() the app issues — and the browser would download the database
         twice. The font preload does need it. -->
    <link rel="preload" href="/data/quran.sqlite.gz" as="fetch" type="application/gzip" />
    <link rel="preload" href="/fonts/indopak-nastaleeq.ttf" as="font" type="font/ttf" crossorigin />

    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- .ico carries 16/32/48/64 for browsers and bookmark bars; the SVG is
         used by anything that prefers vector, so the mark stays crisp on a
         high-DPI tab strip. The small sizes inside the .ico drop the magenta
         frame — at 16px a one-pixel ring is noise, not a border. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/img/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
