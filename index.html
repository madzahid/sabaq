    <!-- The DATABASE IS NOT PRELOADED, deliberately.

         It was, and PageSpeed caught the result: quran.sqlite.gz appeared
         TWICE in the payload, 1,346 KiB each, 2.6 MB of a 3.2 MB page. The
         preload never matched the app's own request — open() reads the body as
         a stream through DecompressionStream, and the browser treated that as
         a different fetch — so the file was downloaded, discarded, and
         downloaded again. On Slow 4G that was seconds of the LCP.

         A preload that misses is worse than no preload at all. The font is
         still preloaded: it is a plain <link>-style load with no such
         mismatch, and it is small. -->
    <link rel="preload" href="/fonts/indopak-nastaleeq.ttf" as="font" type="font/ttf" crossorigin />

    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- .ico carries 16/32/48/64 for browsers and bookmark bars; the SVG is
         used by anything that prefers vector, so the mark stays crisp on a
         high-DPI tab strip. The small sizes inside the .ico drop the magenta
         frame — at 16px a one-pixel ring is noise, not a border. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/img/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
